# What this site has. Written by the site, read only by the QPM; clients see none of it.
# Dollar-brace variables are expanded from the environment at load (string.Template, so a
# literal dollar sign must be written twice). CATALYST_LIB defaults to the installed catalyst
# package's lib/ directory, where the 0.16.0b1 wheel ships the decoder.

[[controller]]
id = "local-cpu-ctrl"
hardware = "cpu"
devices = ["null.qubit"]
max_wires = 64
transports = ["memcpy"]

[[coprocessor]]
id = "local-cpu-coproc"
hardware = "cpu"
transports = ["memcpy"]

[[decoder]]
id = "steane-cpu"
code = "steane"
hardware = "cpu"
symbol = "steane_coprocessor"
lib = "${CATALYST_LIB}/libsteane_coprocessor_cpu.so"
# round_trip_us_p50 unset: memcpy is not measured
